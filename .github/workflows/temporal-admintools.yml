name: temporal-admintools
on:
  schedule: [{ cron: "0 10 * * *" }]
  push:
    branches: [main]
    paths: ["images/temporal-admintools/Dockerfile", "images/temporal-admintools/docker-bake.hcl", ".github/workflows/_build.yml"]
  pull_request:
    paths: ["images/temporal-admintools/Dockerfile", "images/temporal-admintools/docker-bake.hcl",  ".github/workflows/_build.yml"]

permissions: { contents: read, packages: write }

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with: { image: temporal-admintools }
