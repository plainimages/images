name: temporal-server
on:
  schedule: [{ cron: "0 10 * * *" }]
  push:
    branches: [main]
    paths: ["images/temporal-server/**.yaml", ".github/workflows/_build-cgr.yml", ".github/workflows/temporal-server-cgr.yml"]
  pull_request:
    paths: ["images/temporal-server/**.yaml", ".github/workflows/_build-cgr.yml", ".github/workflows/temporal-server-cgr.yml"]

permissions: { contents: read, packages: write }

jobs:
  build:
    uses: ./.github/workflows/_build-cgr.yml
    with:
      image: temporal-server
      archs: x86_64
