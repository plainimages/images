on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            context: images/python
            semver: "3.12"
          - name: python
            context: images/python
            semver: "3.13"
          - name: go
            context: images/go
            semver: "1.27"
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:images/${{ matrix.name }}"
          build-args: |
            SEMVER_VERSION=${{ matrix.semver }}
          push: true
          tags: ghcr.io/plainimages/${{ matrix.name }}:${{ matrix.semver }}
