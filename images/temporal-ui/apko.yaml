contents:
  keyring:
    - keys/melange.rsa.pub
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - "@local packages"
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - zlib
    - temporal-ui@local

accounts:
  groups:
    - groupname: temporal
      gid: 65532
  users:
    - username: temporal
      uid: 65532
      gid: 65532
  run-as: "65532"

paths:
  - path: /etc/temporal-ui
    type: directory
    recursive: true
    uid: 65532
    gid: 0
    permissions: 0o775
  - path: /usr/bin/temporal-ui
    type: permissions
    permissions: 0o755
    uid: 0
    gid: 0
  - path: /etc/temporal-ui/config/docker.yaml
    type: permissions
    permissions: 0o644
    uid: 0
    gid: 0

work-dir: /etc/temporal

entrypoint:
  command: /usr/bin/temporal-ui --root /etc/temporal-ui --env docker
cmd: start

archs:
  - aarch64
  - x86_64
